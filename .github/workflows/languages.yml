name: Update language card

on:
  schedule:
    - cron: "17 4 * * 1"   # tous les lundis, 04h17 UTC
  workflow_dispatch:        # declenchement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate languages.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/generate_language_card.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain languages.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add languages.svg
            git commit -m "Met a jour la carte des langages"
            git push
          else
            echo "Carte inchangee, rien a pousser."
          fi
